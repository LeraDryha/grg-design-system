# On every push and pull request: types, then every story as a test (render, play steps, WCAG 2.2 AA)
name: Checks

on:
  push:
  pull_request:

jobs:
  stories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
